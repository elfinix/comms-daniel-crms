<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | Noblesse Motor Cars</title>
    <style>
        body { margin: 0; font-family: Inter, Arial, sans-serif; background: #071522; color: #fff; display: grid; place-items: center; min-height: 100vh; }
        .card { background: #0c2131; border: 1px solid #1a3c53; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; font-size: 26px; }
        .eyebrow { color: #62e6f4; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        label { display: block; margin: 16px 0 6px; font-size: 13px; color: #a5c3cf; }
        input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 12px 14px; background: #071522; border: 1px solid #234b66; border-radius: 8px; color: #fff; }
        .button { display: block; width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 8px; background: #62e6f4; color: #071522; font-weight: bold; font-size: 15px; cursor: pointer; }
        .foot { margin-top: 20px; font-size: 13px; text-align: center; color: #78909f; }
        .foot a { color: #62e6f4; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="eyebrow">Apex Autos · Client Access</div>
        <h1>Sign in</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="button">Sign In</button>
        </form>
        <div class="foot">
            New customer? <a href="/accounts/register/">Create an account</a><br><br>
            <a href="/">← Return to showroom</a>
        </div>
    </div>
</body>
</html>
