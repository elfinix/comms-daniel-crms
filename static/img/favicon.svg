<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2637" />
      <stop offset="100%" stop-color="#06131f" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64e7f3" />
      <stop offset="100%" stop-color="#1c7c8c" />
    </linearGradient>
    <linearGradient id="silverGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#b4d2db" />
      <stop offset="100%" stop-color="#64e7f3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield / Diamond Frame -->
  <polygon points="32,3 59,16 59,42 32,61 5,42 5,16" fill="url(#shieldGrad)" stroke="url(#cyanGlow)" stroke-width="2.5" />
  
  <!-- Inner Facet Accent -->
  <polygon points="32,9 52,19 52,39 32,54 12,39 12,19" fill="none" stroke="#64e7f3" stroke-width="0.8" opacity="0.4" />

  <!-- Aerodynamic Wings / Speed Chevrons -->
  <path d="M16 22 L32 14 L48 22 L32 26 Z" fill="url(#cyanGlow)" opacity="0.75" />
  
  <!-- Stylized Luxury "N" Emblem -->
  <path d="M22 46 L22 25 L29 25 L38 39 L38 25 L43 25 L43 46 L36 46 L27 32 L27 46 Z" fill="url(#silverGlow)" filter="url(#glow)" />
  
  <!-- Diamond Crest Accent -->
  <polygon points="32,7 35,11 32,15 29,11" fill="#64e7f3" />
</svg>
